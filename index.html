<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>156博客 · 私有资产声明</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(145deg, #f5f7fc 0%, #e9eef5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #1e293b;
      line-height: 1.5;
    }

    .index-card {
      max-width: 720px;
      width: 100%;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 2.5rem;
      box-shadow:
        0 30px 50px -20px rgba(0, 0, 0, 0.15),
        0 0 0 1px rgba(255, 255, 255, 0.7) inset,
        0 0 60px rgba(70, 100, 180, 0.08);
      padding: 3rem 2.8rem;
      border: 1px solid rgba(255, 255, 255, 0.6);
      text-align: center;
    }

    /* 头部标识 */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .blog-icon {
      background: #1e293b;
      color: white;
      width: 72px;
      height: 72px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.3);
      font-weight: 700;
      font-size: 2rem;
      letter-spacing: -0.02em;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0f172a;
      line-height: 1.2;
    }

    .blog-mark {
      display: inline-block;
      background: #1e293b;
      color: white;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      letter-spacing: 0.04em;
      margin-left: 0.6rem;
      vertical-align: middle;
    }

    .subhead {
      font-size: 1rem;
      font-weight: 400;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .subhead svg {
      width: 18px;
      height: 18px;
      stroke: #64748b;
      stroke-width: 2;
      fill: none;
      flex-shrink: 0;
    }

    /* 禁止搬运大徽章 */
    .badge-large {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: #fee2e2;
      color: #b91c1c;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.8rem 1.8rem;
      border-radius: 100px;
      box-shadow: 0 4px 12px rgba(185, 28, 28, 0.15);
      border: 1.5px solid #fecaca;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .badge-large svg {
      width: 20px;
      height: 20px;
      stroke: #b91c1c;
      stroke-width: 2.2;
      fill: none;
    }

    /* 授权提示块 */
    .meta-note {
      background: #f1f5f9;
      border-radius: 1.4rem;
      padding: 1.5rem 1.8rem;
      margin: 2rem 0;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      border: 1px solid #e2e8f0;
      color: #334155;
      font-size: 1rem;
      text-align: left;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      line-height: 1.6;
    }

    .meta-note svg {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      stroke: #475569;
      stroke-width: 1.8;
      fill: none;
      margin-top: 2px;
    }

    .meta-note a {
      color: #0f172a;
      font-weight: 700;
      text-decoration: none;
      border-bottom: 2px solid #cbd5e1;
      transition: border-color 0.15s ease, color 0.15s ease;
      padding-bottom: 1px;
    }

    .meta-note a:hover {
      color: #b91c1c;
      border-bottom-color: #b91c1c;
    }

    /* 版权声明区 */
    .copyright-box {
      background: #f8fafc;
      border-radius: 1.4rem;
      padding: 1.5rem 1.8rem;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 1rem;
      text-align: left;
      font-size: 0.95rem;
      color: #475569;
      margin-bottom: 2rem;
    }

    .copyright-box svg {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      stroke: #475569;
      stroke-width: 1.8;
      fill: none;
    }

    .copyright-box strong {
      color: #0f172a;
      font-weight: 600;
    }

    /* 底部 LICENSE 链接 */
    .footer-note {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding-top: 1.5rem;
      border-top: 1px dashed #cbd5e1;
    }

    .LICENSE-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #f8fafc;
      padding: 0.75rem 1.6rem;
      border-radius: 100px;
      font-weight: 600;
      font-size: 1rem;
      color: #0f172a;
      text-decoration: none;
      border: 1px solid #e2e8f0;
      transition: all 0.15s ease;
    }

    .LICENSE-link:hover {
      background: #ffffff;
      border-color: #b91c1c;
      color: #b91c1c;
      box-shadow: 0 2px 10px rgba(185, 28, 28, 0.08);
    }

    .LICENSE-link svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
    }

    /* 响应式 */
    @media (max-width: 600px) {
      .index-card {
        padding: 2.2rem 1.6rem;
        border-radius: 2rem;
      }

      h1 {
        font-size: 1.8rem;
      }

      .blog-icon {
        width: 60px;
        height: 60px;
        border-radius: 18px;
        font-size: 1.6rem;
      }

      .meta-note,
      .copyright-box {
        padding: 1.2rem 1.3rem;
        font-size: 0.92rem;
      }

      .badge-large {
        font-size: 0.9rem;
        padding: 0.7rem 1.4rem;
      }
    }

    @media (max-width: 420px) {
      h1 {
        font-size: 1.5rem;
      }

      .subhead {
        flex-direction: column;
        gap: 0.3rem;
      }

      .meta-note,
      .copyright-box {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.8rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
